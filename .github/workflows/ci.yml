name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:
    secrets:
      GH_APP_CREDS:
        required: true
  schedule:
    - cron: '0 22 * * 2'

permissions: {}

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  integration-tests:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: test-typescript
    uses: ./.github/workflows/integration-tests.yml
    permissions:
      contents: write
    secrets:
      GH_APP_CREDS: ${{ secrets.GH_APP_CREDS }}
